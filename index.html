```html
<!DOCTYPE html>
<html>
<head>
<title>BOOKFLIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#141414;
color:white;
font-family:Arial;
}

/* LOADER */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity 1s;
}

#loader.fade{
opacity:0;
pointer-events:none;
}

.loaderB{
font-size:120px;
color:#e50914;
font-weight:bold;
animation:glow 1.4s infinite alternate;
}

@keyframes glow{
from{transform:scale(1);text-shadow:0 0 10px #e50914;}
to{transform:scale(1.15);text-shadow:0 0 40px #e50914;}
}

/* NAVBAR */

.navbar{
background:black;
padding:15px;
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

.logo{
color:#e50914;
font-size:26px;
font-weight:bold;
cursor:pointer;
}

input{
padding:8px;
border:none;
border-radius:4px;
}

/* FEATURED */

#featured{
min-height:350px;
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:40px;
}

#featuredInfo{
background:rgba(0,0,0,0.6);
padding:20px;
border-radius:6px;
max-width:400px;
}

/* BOOK GRID */

#results,#searchResults{
display:flex;
flex-wrap:wrap;
gap:20px;
padding:20px;
justify-content:center;
}

.book{
width:150px;
position:relative;
cursor:pointer;
}

.book img{
width:100%;
border-radius:6px;
transition:0.3s;
}

.book:hover img{
transform:scale(1.15);
}

.hoverCard{
position:absolute;
bottom:0;
left:0;
right:0;
background:rgba(0,0,0,0.9);
padding:10px;
opacity:0;
transition:0.3s;
border-radius:0 0 6px 6px;
font-size:14px;
}

.book:hover .hoverCard{
opacity:1;
}

.readBtn{
background:#e50914;
border:none;
color:white;
padding:5px 10px;
margin-top:5px;
cursor:pointer;
}

/* READER */

#reader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
z-index:1000;
}

#reader iframe{
flex:1;
border:none;
}

#closeReader{
background:#e50914;
border:none;
color:white;
padding:12px;
cursor:pointer;
}

/* FOOTER */

footer{
text-align:center;
color:#888;
padding:30px;
font-size:12px;
}

/* MOBILE */

@media (max-width:700px){
.book{width:40%;}
#featured{padding:20px;}
}

@media (max-width:450px){
.book{width:80%;}
.navbar{flex-direction:column;align-items:flex-start;}
}

</style>
</head>

<body>

<div id="loader">
<div class="loaderB">B</div>
<div>BOOKFLIX loading...</div>
</div>

<div class="navbar">
<div class="logo" onclick="goHome()">BOOKFLIX</div>
<input id="searchBox" placeholder="Search books...">
<button onclick="searchBooks()">Search</button>
</div>

<div id="featured">
<div id="featuredInfo">
<h1 id="featuredTitle"></h1>
<p id="featuredAuthor"></p>
<button onclick="readFeatured()">READ</button>
</div>
</div>

<h2 style="padding-left:20px;">Search Results</h2>
<div id="searchResults"></div>

<h2 style="padding-left:20px;">More Like This</h2>
<div id="results"></div>

<div id="reader">
<button id="closeReader" onclick="closeReader()">Close Reader</button>
<iframe id="readerFrame"></iframe>
</div>

<footer>
made by liam rodriguez
</footer>

<script>

let featuredEdition="";

/* FEATURED BOOK */

async function loadFeatured(){

try{

let res=await fetch("https://openlibrary.org/search.json?q=harry+potter");
let data=await res.json();

let book=data.docs.find(b=>b.cover_i && b.edition_key);

if(!book) return;

featuredEdition=book.edition_key[0];

document.getElementById("featuredTitle").innerText=book.title;

document.getElementById("featuredAuthor").innerText=
book.author_name?book.author_name[0]:"Unknown";

document.getElementById("featured").style.backgroundImage=
"url(https://covers.openlibrary.org/b/id/"+book.cover_i+"-L.jpg)";

}catch(e){
console.log("Featured failed");
}

}

/* CREATE BOOK CARD */

function createBook(book,parent){

let cover=book.cover_i
?"https://covers.openlibrary.org/b/id/"+book.cover_i+"-M.jpg"
:"https://via.placeholder.com/150x220?text=Book";

let author=book.author_name?book.author_name[0]:"Unknown";
let edition=book.edition_key?book.edition_key[0]:null;

if(!edition) return;

let div=document.createElement("div");
div.className="book";

div.innerHTML=`
<img src="${cover}">
<div class="hoverCard">
<b>${book.title}</b><br>
${author}<br>
<button class="readBtn">READ</button>
</div>
`;

div.querySelector(".readBtn").onclick=(e)=>{
e.stopPropagation();
openReader(edition);
};

parent.appendChild(div);

}

/* SEARCH */

async function searchBooks(){

document.getElementById("featured").style.display="none";

let query=document.getElementById("searchBox").value||"fantasy";

let res=await fetch("https://openlibrary.org/search.json?q="+query);
let data=await res.json();

let container=document.getElementById("searchResults");
container.innerHTML="";

data.docs.slice(0,20).forEach(b=>createBook(b,container));

}

/* RECOMMENDATIONS */

async function loadRecommendations(){

try{

let res=await fetch("https://openlibrary.org/search.json?q=classic");
let data=await res.json();

let container=document.getElementById("results");
container.innerHTML="";

data.docs.slice(0,20).forEach(b=>createBook(b,container));

}catch(e){
console.log("recommendations failed");
}

}

/* READER */

function openReader(edition){

document.getElementById("reader").style.display="flex";

document.getElementById("readerFrame").src=
"https://openlibrary.org/books/"+edition+"/embed";

}

function closeReader(){

document.getElementById("reader").style.display="none";
document.getElementById("readerFrame").src="";

}

/* HOME */

function goHome(){

document.getElementById("featured").style.display="flex";
document.getElementById("searchResults").innerHTML="";

}

/* START SITE */

loadFeatured();
loadRecommendations();

/* REMOVE LOADER */

setTimeout(()=>{
document.getElementById("loader").classList.add("fade");
},1800);

</script>

</body>
</html>
