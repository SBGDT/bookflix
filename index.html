
<!DOCTYPE html>
<html>

<head>
<title>BOOKFLIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#141414;
color:white;
font-family:Arial;
}

/* LOADER */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity 1s ease;
}

#loader.fade{
opacity:0;
pointer-events:none;
}

.loaderB{
font-size:120px;
font-weight:bold;
color:#e50914;
animation: glow 1.4s infinite alternate;
}

@keyframes glow{
from{
transform:scale(1);
text-shadow:0 0 10px #e50914;
}
to{
transform:scale(1.15);
text-shadow:0 0 40px #e50914;
}
}

.loadingText{
color:#aaa;
margin-top:10px;
}

/* NAVBAR */

.navbar{
background:black;
padding:15px;
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

.logo{
color:#e50914;
font-size:26px;
font-weight:bold;
cursor:pointer;
}

input{
padding:8px;
border:none;
border-radius:4px;
}

/* FEATURED */

#featured{
min-height:350px;
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:40px;
}

#featuredInfo{
background:rgba(0,0,0,0.6);
padding:20px;
border-radius:6px;
max-width:400px;
}

/* BOOK GRID */

#results,#searchResults{
display:flex;
flex-wrap:wrap;
gap:20px;
padding:20px;
justify-content:center;
}

.book{
width:150px;
position:relative;
cursor:pointer;
}

.book img{
width:100%;
border-radius:6px;
transition:0.3s;
}

.book:hover img{
transform:scale(1.15);
}

.hoverCard{
position:absolute;
bottom:0;
left:0;
right:0;
background:rgba(0,0,0,0.9);
padding:10px;
opacity:0;
transition:0.3s;
border-radius:0 0 6px 6px;
font-size:14px;
}

.book:hover .hoverCard{
opacity:1;
}

.readBtn{
background:#e50914;
border:none;
color:white;
padding:5px 10px;
margin-top:5px;
cursor:pointer;
}

/* READER */

#reader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
z-index:1000;
}

#reader iframe{
flex:1;
border:none;
}

#closeReader{
background:#e50914;
border:none;
color:white;
padding:12px;
cursor:pointer;
}

/* FOOTER */

footer{
text-align:center;
color:#888;
padding:30px;
font-size:12px;
}

/* MOBILE */

@media (max-width:700px){
.book{width:40%;}
#featured{padding:20px;}
#featured h1{font-size:24px;}
}

@media (max-width:450px){
.book{width:80%;}
.navbar{flex-direction:column;align-items:flex-start;}
}

</style>
</head>

<body>

<!-- LOADER -->

<div id="loader">
<div class="loaderB">B</div>
<div class="loadingText">BOOKFLIX loading...</div>
</div>

<div class="navbar">
<div class="logo" onclick="goHome()">BOOKFLIX</div>
<input id="searchBox" placeholder="Search books...">
<button onclick="searchBooks()">Search</button>
</div>

<div id="featured">
<div id="featuredInfo">
<h1 id="featuredTitle"></h1>
<p id="featuredAuthor"></p>
<button onclick="readFeatured()">READ</button>
</div>
</div>

<h2 style="padding-left:20px;">Search Results</h2>
<div id="searchResults"></div>

<h2 style="padding-left:20px;">More Like This</h2>
<div id="results"></div>

<div id="reader">
<button id="closeReader" onclick="closeReader()">Close Reader</button>
<iframe id="readerFrame"></iframe>
</div>

<footer>
made by liam rodriguez
</footer>

<script>

let featuredBookKey="";

/* FEATURED */

async function loadFeatured(){

try{

let response=await fetch("https://openlibrary.org/search.json?q=fantasy&has_fulltext=true");
let data=await response.json();

let book=data.docs.find(b=>b.cover_i && b.edition_key);

if(!book) return;

let cover="https://covers.openlibrary.org/b/id/"+book.cover_i+"-L.jpg";

document.getElementById("featured").style.backgroundImage="url("+cover+")";

document.getElementById("featuredTitle").innerText=book.title;

document.getElementById("featuredAuthor").innerText=
book.author_name ? book.author_name[0] : "Unknown";

featuredBookKey=book.edition_key[0];

}catch(e){
console.log("Featured failed");
}

}

/* SEARCH */

async function searchBooks(){

document.getElementById("featured").style.display="none";

let query=document.getElementById("searchBox").value;
if(query===""){query="fantasy";}

let response=await fetch("https://openlibrary.org/search.json?q="+query+"&has_fulltext=true");
let data=await response.json();

let results=document.getElementById("searchResults");
results.innerHTML="";

data.docs
.filter(book=>book.cover_i && book.edition_key)
.slice(0,20)
.forEach(book=>{

let cover="https://covers.openlibrary.org/b/id/"+book.cover_i+"-M.jpg";
let author=book.author_name ? book.author_name[0] : "Unknown";
let edition=book.edition_key[0];

let div=document.createElement("div");
div.className="book";

div.innerHTML=`
<img src="${cover}">
<div class="hoverCard">
<b>${book.title}</b><br>
${author}<br>
<button class="readBtn">READ</button>
</div>
`;

div.querySelector(".readBtn").onclick=(e)=>{
e.stopPropagation();
openReader(edition);
};

results.appendChild(div);

});

}

/* RECOMMENDATIONS */

async function loadRecommendations(){

try{

let response=await fetch("https://openlibrary.org/search.json?q=classic&has_fulltext=true");
let data=await response.json();

let results=document.getElementById("results");
results.innerHTML="";

data.docs
.filter(book=>book.cover_i && book.edition_key)
.slice(0,20)
.forEach(book=>{

let cover="https://covers.openlibrary.org/b/id/"+book.cover_i+"-M.jpg";
let author=book.author_name ? book.author_name[0] : "Unknown";
let edition=book.edition_key[0];

let div=document.createElement("div");
div.className="book";

div.innerHTML=`
<img src="${cover}">
<div class="hoverCard">
<b>${book.title}</b><br>
${author}<br>
<button class="readBtn">READ</button>
</div>
`;

div.querySelector(".readBtn").onclick=(e)=>{
e.stopPropagation();
openReader(edition);
};

results.appendChild(div);

});

}catch(e){
console.log("Recommendations failed");
}

}

/* READER */

function openReader(edition){

document.getElementById("reader").style.display="flex";
document.getElementById("readerFrame").src=
"https://openlibrary.org/books/"+edition+"/embed";

}

function closeReader(){

document.getElementById("reader").style.display="none";
document.getElementById("readerFrame").src="";

}

/* HOME */

function goHome(){

document.getElementById("featured").style.display="flex";
document.getElementById("searchResults").innerHTML="";

}

/* START */

loadFeatured();
loadRecommendations();

/* FADE LOADER AFTER 2s */

setTimeout(()=>{
document.getElementById("loader").classList.add("fade");
},2000);

</script>

</body>
</html>
